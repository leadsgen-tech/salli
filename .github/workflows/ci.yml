name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Parser, domain + data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Privacy invariants
        run: |
          set -euo pipefail
          if grep -qiE "firebase|mixpanel|analytics|crashlytics|posthog|sentry|mediapipe" gradle/libs.versions.toml; then
            echo "::error::analytics or AI SDK found in the version catalog"; exit 1
          fi
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "::error::INTERNET permission must never be declared"; exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew :parser:test :domain:test :data:test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            parser/build/reports/tests/
            domain/build/reports/tests/
            data/build/reports/tests/
          retention-days: 7

# APK builds are handled by release.yml on v* tags (and via manual dispatch for
# ad-hoc APKs), so every main-branch push doesn't spin up a full Android build.
